<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>ارسال طلب - مطعم قصي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {background-color: black; color: #DAA520; font-family: Arial; margin: 0; padding: 20px; text-align: center;}
        h1 {font-size: 36px; color: #DAA520;}
        .form-box {background-color: #DAA520; color: black; padding: 25px; border-radius: 15px; margin: 20px auto; max-width: 450px; text-align: right;}
        label {font-size: 22px; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px;}
        input, textarea {width: 95%; padding: 14px; font-size: 20px; border: 3px solid black; border-radius: 10px; background: white; font-family: Arial;}
        textarea {height: 100px; resize: none;}
        .btn {background: black; color: #DAA520; border: none; padding: 18px; font-size: 24px; font-weight: bold; border-radius: 15px; margin-top: 20px; cursor: pointer; width: 100%;}
    </style>
</head>
<body>

    <h1>👑 ارسال طلب 👑</h1>

    <div class="form-box">
        <form id="orderForm">
            <label>1. شو بدك تطلب؟</label>
            <textarea id="order" placeholder="مثال: 2 شاورما دجاج + بيبسي + كنافة" required></textarea>

            <label>2. الاسم الثلاثي</label>
            <input type="text" id="name" placeholder="اكتب اسمك" required>

            <label>3. رقم التلفون</label>
            <input type="tel" id="phone" placeholder="07xxxxxxxx" required>

            <label>4. العنوان بالتفصيل</label>
            <textarea id="address" placeholder="مثال: عمان - جبل الحسين - شارع..." required></textarea>

            <label>5. ملاحظات</label>
            <textarea id="notes" placeholder="مثال: بدون بصل , الدفع كاش" ></textarea>

            <button type="submit" class="btn">تأكيد الطلب</button>
        </form>
    </div>

    <button class="btn" style="background:#DAA520; color:black;" onclick="window.location.href='index.html'">الرجوع للمنيو</button>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // رقمك انا حطيته
            var myNumber = "962777696341"; 
            
            var order = document.getElementById('order').value;
            var name = document.getElementById('name').value;
            var phone = document.getElementById('phone').value;
            var address = document.getElementById('address').value;
            var notes = document.getElementById('notes').value;

            var message = `طلب جديد من مطعم قصي 👑%0A%0A`;
            message += `*الطلب:* ${order}%0A`;
            message += `*الاسم:* ${name}%0A`;
            message += `*التلفون:* ${phone}%0A`;
            message += `*العنوان:* ${address}%0A`;
            message += `*ملاحظات:* ${notes}`;

            var url = `https://wa.me/${myNumber}?text=${message}`;
            window.open(url, '_blank');
        });
    </script>

</body>
</html>
