<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>ارسال طلب - مطعم قصي</title>
    <style>
        body { background: #DAA520; border: 20px solid black; font-family: Arial; padding: 20px; }
        h1 { text-align: center; color: black; font-size: 40px; }
        form { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; }
        label { font-size: 22px; font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 12px; font-size: 20px; margin-top: 5px; border: 2px solid black; border-radius: 8px; }
        .btn-send { background: black; color: #DAA520; padding: 15px; font-size: 24px; border: none; width: 100%; margin-top: 20px; border-radius: 10px; cursor: pointer; }
        .btn-back { background: #555; color: white; padding: 10px; font-size: 20px; border: none; width: 100%; margin-top: 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>📝 ارسال طلب جديد</h1>
    <form>
        <label>الاسم</label>
        <input type="text" placeholder="اكتب اسمك" required>
        
        <label>رقم الهاتف</label>
        <input type="tel" placeholder="07xxxxxxxx" required>
        
        <label>العنوان</label>
        <textarea placeholder="اكتب عنوانك بالتفصيل" rows="3" required></textarea>
        
        <label>ملاحظات على الطلب</label>
        <textarea placeholder="مثلا: بدون بصل، زيادة جبنة" rows="3"></textarea>
        
        <button type="submit" class="btn-send">تأكيد الطلب</button>
        <button type="button" class="btn-back" onclick="window.location.href='index.html'">الرجوع للمنيو</button>
    </form>
</body>
</html>
