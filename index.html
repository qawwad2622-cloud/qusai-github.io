<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>منيو مطعم قصي</title>
    <style>
        body {
            background-color: #DAA520;  /* ذهبي ملكي */
            border: 20px solid black;   
            font-family: Arial;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        /* الهيدر العلوي */
        .header {
            background: black;
            color: #DAA520;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        .menu-icon {
            font-size: 30px;
            cursor: pointer;
        }
        h1 { text-align: center; font-size: 35px; margin: 0; }

        /* القائمة الجانبية */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            right: 0;
            background-color: black;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            z-index: 1000;
        }
        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 22px;
            color: #DAA520;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover { background: #333; }
        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 40px;
            color: #DAA520;
        }

        /* محتوى المنيو */
        .content { padding: 20px; text-align: center; }
        h2 {
            background: black;
            color: #DAA520;
            padding: 10px;
            border-radius: 10px;
            margin: 20px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            margin: 15px 30px;
            font-size: 20px;
            color: black;
            border-bottom: 1px dashed black;
            padding-bottom: 8px;
        }
        .price { font-weight: bold; }

        /* زر الطلب تحت */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: black;
            padding: 15px;
            text-align: center;
            left: 0;
        }
        .btn {
            background: #DAA520;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            margin: 0 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الهيدر مع ايقونة المنيو -->
    <div class="header">
        <h1>مطعم قصي</h1>
        <span class="menu-icon" onclick="openNav()">☰</span>
    </div>

    <!-- القائمة الجانبية -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="#">📋 المنيو</a>
        <a href="#">💬 التواصل مع العملاء</a>
        <a href="#">❓ الاستفسار</a>
        <a href="#">🚚 تتبع الطلب</a>
    </div>

    <!-- محتوى المنيو -->
    <div class="content">
        <h2>السندويشات</h2>
        <div class="item"><span>شاورما دجاج</span><span class="price">2.5 د.ا</span></div>
        <div class="item"><span>شاورما لحم</span><span class="price">3 د.ا</span></div>
        <div class="item"><span>برغر لحم</span><span class="price">4 د.ا</span></div>

        <h2>البيتزا</h2>
        <div class="item"><span>بيتزا مارجريتا</span><span class="price">6 د.ا</span></div>
        <div class="item"><span>بيتزا دجاج</span><span class="price">8 د.ا</span></div>

        <h2>الحلويات</h2>
        <div class="item"><span>كنافة نابلسية</span><span class="price">4 د.ا</span></div>
        <div style="padding-bottom: 100px;"></div> <!-- فراغ عشان الزر -->
    </div>

    <!-- الازرار تحت -->
    <div class="footer">
        <button class="btn" onclick="window.location.href='order.html'">ارسال طلب</button>
        <button class="btn">الغاء طلب</button>
    </div>

    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }
    </script>

</body>
        </html>
